name: DCTR reproducibility checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Verify primary hashes, paths, TSV and composition
        run: python scripts/verify_primary_evidence.py
