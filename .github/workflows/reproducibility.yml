name: DCTR reproducibility checks

on:
  push:
    branches: [main, 'round3/**', 'round4/**']
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official MCP Python SDK v1 for integration tests
        run: python -m pip install 'mcp==1.28.0'
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Verify Round 3 anonymized pilot statistics
        run: python scripts/verify_round3_public_pilot.py
      - name: Verify unlabelled Round 3 natural-candidate snapshot reconstruction
        run: python scripts/verify_round3_natural_candidates.py
      - name: Verify blinded Stage3N annotator A/B packets contain identical evidence and no labels
        run: python scripts/verify_round3_natural_packets.py
      - name: Verify primary hashes, paths, TSV and composition
        run: python scripts/verify_primary_evidence.py

  official-mcp-sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official MCP Python SDK pinned for test
        run: python -m pip install 'mcp==1.30.0'
      - name: Exercise DCTR via real SDK ClientSession and subprocess stdio server
        run: python -m unittest discover -s tests -p 'sdk_*.py' -v

  upstream-immutable-source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 7 source-level mutations and FS03 reconstruction offline
        run: python scripts/verify_round3_upstream_source_literals.py
      - name: Verify upstream first-parent commit blobs and changed Tool-definition markers
        run: python scripts/verify_round3_upstream_source_literals.py --online
