name: DCTR reproducibility checks

on:
  push:
    branches: [main, 'round3/**']
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official MCP Python SDK v1 for integration tests
        run: python -m pip install 'mcp==1.28.0'
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Verify Round 3 anonymized pilot statistics
        run: python scripts/verify_round3_public_pilot.py
      - name: Verify unlabelled Round 3 natural-candidate snapshot reconstruction
        run: python scripts/verify_round3_natural_candidates.py
      - name: Verify primary hashes, paths, TSV and composition
        run: python scripts/verify_primary_evidence.py
